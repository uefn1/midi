<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>軽量MIDIプレイヤー</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
  button { font-size: 18px; padding: 12px 24px; margin: 8px; }
  button:disabled { opacity: .4; }
  #status { margin-top: 16px; color: #666; font-size: 14px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>大容量MIDI 軽量ストリーミング再生</h2>
<input type="file" id="fileInput" accept=".mid,.midi,audio/midi,audio/x-midi">
<br>
<button id="playBtn" disabled>▶ 再生</button>
<button id="stopBtn" disabled>■ 停止</button>
<div id="status">ファイルを選択してください</div>

<script>
(function () {
  'use strict';

  // ============ ストリーミングMIDIパーサー ============
  // チャンクを feed() で投入 → nextEvent() で1件ずつ取り出す。
  // 未解析バッファは小さいまま（最大32KBはfeedLoop側で制御）。
  class MIDIStream {
    constructor() {
      this.buf = new Uint8Array(0);
      this.bufPos = 0;
      this.skipRemaining = 0;   // メタ/シーケンスの読み飛ばし残り
      this.eof = false;
      this.parseDone = false;
      this.phase = 'mthd';       // mthd → mtrk → event
      this.division = 480;
      this.tempo = 500000;
      this.time = 0;
      this.runningStatus = 0;
      this.trackRemaining = 0;
    }
    buffered() { return this.buf.length - this.bufPos; }

    feed(chunk) {
      if (this.parseDone) return;
      // 読み飛ばし中はバッファに積まない
      if (this.skipRemaining > 0) {
        const skip = Math.min(this.skipRemaining, chunk.length);
        this.skipRemaining -= skip;
        if (skip >= chunk.length) return;
        chunk = chunk.subarray(skip);
      }
      // 先頭の消費済みバイトを捨てて結合
      if (this.bufPos > 0) {
        this.buf = this.buf.slice(this.bufPos);
        this.bufPos = 0;
      }
      const merged = new Uint8Array(this.buf.length + chunk.length);
      merged.set(this.buf);
      merged.set(chunk, this.buf.length);
      this.buf = merged;
    }

    setEof() { this.eof = true; }

    nextEvent() {
      while (!this.parseDone) {
        if (this.skipRemaining > 0) {
          const avail = this.buffered();
          if (avail === 0) return this._needMore();
          const skip = Math.min(this.skipRemaining, avail);
          this.bufPos += skip;
          this.skipRemaining -= skip;
          continue;
        }
        if (this.phase === 'mthd') {
          if (this.buffered() < 14) return this._needMore();
          const p = this.bufPos;
          if (this.buf[p] !== 0x4D || this.buf[p+1] !== 0x54 ||
              this.buf[p+2] !== 0x68 || this.buf[p+3] !== 0x64) {
            this.parseDone = true; return null;
          }
          this.division = (this.buf[p+12] << 8) | this.buf[p+13];
          this.bufPos += 14;
          this.phase = 'mtrk';
          continue;
        }
        if (this.phase === 'mtrk') {
          if (this.buffered() < 8) return this._needMore();
          const p = this.bufPos;
          const chunkLen = ((this.buf[p+4]<<24)|(this.buf[p+5]<<16)|(this.buf[p+6]<<8)|this.buf[p+7]) >>> 0;
          const isTrack = this.buf[p] === 0x4D && this.buf[p+1] === 0x54 &&
                          this.buf[p+2] === 0x72 && this.buf[p+3] === 0x6B;
          this.bufPos += 8;
          if (isTrack) { this.trackRemaining = chunkLen; this.phase = 'event'; }
          else         { this.skipRemaining = chunkLen; }
          continue;
        }
        if (this.phase === 'event') {
          if (this.trackRemaining <= 0) { this.phase = 'mtrk'; continue; }
          if (this.buffered() < 16) return this._needMore();
          const ev = this._parseEvent();
          if (ev) return ev;
          continue;
        }
      }
      return null;
    }

    _needMore() {
      if (this.eof) this.parseDone = true;
      return null;
    }

    _parseEvent() {
      const buf = this.buf;
      const startPos = this.bufPos;
      let p = startPos;

      // デルタタイム（可変長）
      let delta = 0;
      for (let i = 0; i < 4; i++) {
        const b = buf[p++];
        delta = (delta << 7) | (b & 0x7F);
        if ((b & 0x80) === 0) break;
      }
      this.time += delta * this.tempo / this.division / 1e6;

      // ステータス or ランニングステータス
      let status = buf[p];
      if (status < 0x80) {
        status = this.runningStatus;   // pは据え置き（データバイト）
      } else {
        p++;
        if (status < 0xF0) this.runningStatus = status;
      }

      let event = null;

      if (status >= 0x80 && status < 0xF0) {
        const type = status & 0xF0;
        const ch   = status & 0x0F;
        if (type === 0x90 || type === 0x80) {
          const note = buf[p++];
          const vel  = buf[p++];
          if (type === 0x90 && vel > 0) {
            event = { type:'on',  note, vel: vel/127, ch, time: this.time };
          } else {
            event = { type:'off', note, ch, time: this.time };
          }
        } else if (type === 0xC0 || type === 0xD0) { p += 1; }
        else                                       { p += 2; }
      } else if (status === 0xFF) {
        const metaType = buf[p++];
        let mlen = 0;
        for (let i = 0; i < 4; i++) {
          const b = buf[p++];
          mlen = (mlen << 7) | (b & 0x7F);
          if ((b & 0x80) === 0) break;
        }
        if (metaType === 0x51 && mlen === 3) {
          this.tempo = (buf[p]<<16)|(buf[p+1]<<8)|buf[p+2];
        }
        if (metaType === 0x2F) {           // End of Track
          this.trackRemaining = 0;
          p += mlen;
        } else {
          const avail = buf.length - p;
          if (avail < mlen) { this.skipRemaining = mlen - avail; p = buf.length; }
          else              { p += mlen; }
        }
      } else if (status === 0xF0 || status === 0xF7) {
        let mlen = 0;
        for (let i = 0; i < 4; i++) {
          const b = buf[p++];
          mlen = (mlen << 7) | (b & 0x7F);
          if ((b & 0x80) === 0) break;
        }
        const avail = buf.length - p;
        if (avail < mlen) { this.skipRemaining = mlen - avail; p = buf.length; }
        else              { p += mlen; }
      } else {
        this.trackRemaining = 0; p = buf.length;
      }

      const consumed = p - startPos;
      this.bufPos = p;
      if (this.trackRemaining > 0) {
        this.trackRemaining = Math.max(0, this.trackRemaining - consumed);
      }
      return event;
    }
  }

  // ============ 再生 ============
  const fileInput = document.getElementById('fileInput');
  const playBtn   = document.getElementById('playBtn');
  const stopBtn   = document.getElementById('stopBtn');
  const statusEl  = document.getElementById('status');

  const LOOKAHEAD        = 0.5;   // 秒
  const MAX_PENDING      = 50;    // 未スケジュールイベント上限
  const MAX_VOICES       = 16;    // 同時発音数上限
  const SCHED_INTERVAL   = 100;   // ms
  const MAX_BUFFER_BYTES = 32 * 1024; // パーサー未解析バッファ上限

  let audioCtx, masterGain, parser, reader;
  let isPlaying = false, pending = [], openNotes = new Map();
  let schedTimer = null, playStart = 0;

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  async function feedLoop(stream, localParser) {
    reader = stream.getReader();
    try {
      while (true) {
        // バックプレッシャ: バッファが大きければ待つ
        while (localParser.buffered() > MAX_BUFFER_BYTES && !localParser.parseDone) {
          await sleep(30);
        }
        if (localParser.parseDone) return;
        const { done, value } = await reader.read();
        if (!parser) return;
        if (done) { localParser.setEof(); return; }
        localParser.feed(value);
      }
    } catch (e) {
      if (e && e.name !== 'AbortError') console.error(e);
    }
  }

  function schedule() {
    if (!isPlaying) return;
    const now    = audioCtx.currentTime;
    const nowRel = now - playStart;

    // バッファ補充（上限まで）
    while (pending.length < MAX_PENDING) {
      const ev = parser.nextEvent();
      if (!ev) break;
      pending.push(ev);
    }

    // 先読み範囲内のイベントをオーディオスケジューラへ
    while (pending.length && pending[0].time <= nowRel + LOOKAHEAD) {
      const ev = pending.shift();
      const when = Math.max(playStart + ev.time, now);
      if (ev.type === 'on') startNote(ev, when);
      else                   stopNote(ev, when);
    }

    if (parser.parseDone && pending.length === 0) {
      statusEl.textContent = '再生完了';
      setTimeout(() => { if (isPlaying) stopPlayback(); }, 1500);
      return;
    }
    schedTimer = setTimeout(schedule, SCHED_INTERVAL);
  }

  function startNote(ev, when) {
    const key = ev.ch * 128 + ev.note;
    if (openNotes.has(key)) stopNoteKey(key, when);

    // ポリフォニー上限：Map挿入順の先頭＝最古の音を落とす
    if (openNotes.size >= MAX_VOICES) {
      const oldKey = openNotes.keys().next().value;
      stopNoteKey(oldKey, when);
    }

    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 440 * Math.pow(2, (ev.note - 69) / 12);
    const peak = 0.12 * ev.vel;
    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(peak, when + 0.005);
    osc.connect(gain).connect(masterGain);
    osc.start(when);
    openNotes.set(key, { osc, gain });
  }

  function stopNote(ev, when) { stopNoteKey(ev.ch * 128 + ev.note, when); }

  function stopNoteKey(key, when) {
    const n = openNotes.get(key);
    if (!n) return;
    const t = Math.max(when, audioCtx.currentTime + 0.01);
    try {
      n.gain.gain.cancelScheduledValues(t);
      n.gain.gain.setTargetAtTime(0, t, 0.03);
      n.osc.stop(t + 0.15);
    } catch (e) {}
    openNotes.delete(key);
  }

  async function play(file) {
    stopPlayback();
    playBtn.disabled = true;
    statusEl.textContent = '読み込み中…';

    parser   = new MIDIStream();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(audioCtx.destination);

    playStart = audioCtx.currentTime + 0.1;
    isPlaying = true;
    pending = [];
    openNotes = new Map();

    feedLoop(file.stream(), parser);   // バックグラウンドで供給

    stopBtn.disabled = false;
    statusEl.textContent = '再生中…';
    schedule();
  }

  function stopPlayback() {
    isPlaying = false;
    clearTimeout(schedTimer);
    if (reader) { try { reader.cancel(); } catch (e) {} reader = null; }
    if (audioCtx) {
      const t = audioCtx.currentTime;
      for (const { osc, gain } of openNotes.values()) {
        try { gain.gain.cancelScheduledValues(t); gain.gain.setTargetAtTime(0, t, 0.02); } catch (e) {}
        try { osc.stop(); } catch (e) {}
      }
    }
    openNotes.clear(); pending = []; parser = null;
    if (masterGain) { try { masterGain.disconnect(); } catch (e) {} masterGain = null; }
    if (audioCtx)   { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    playBtn.disabled = !(fileInput.files && fileInput.files[0]);
    stopBtn.disabled = true;
  }

  // ============ UI ============
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) { playBtn.disabled = true; statusEl.textContent = 'ファイルを選択してください'; return; }
    playBtn.disabled = false;
    statusEl.textContent = `選択中: ${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`;
  });

  playBtn.addEventListener('click', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    try { await play(file); }
    catch (e) {
      console.error(e);
      statusEl.textContent = '再生エラー: ' + e.message;
      stopPlayback();
    }
  });

  stopBtn.addEventListener('click', stopPlayback);
})();
</script>
</body>
</html>
